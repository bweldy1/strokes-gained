<!-- SETTINGS SHEET -->
<div class="sheet-overlay" id="settings-sheet" onclick="handleSettingsOverlayClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Settings</div>
    <div class="sheet-body">

      <div class="settings-section-label">Appearance</div>
      <div class="settings-hint" style="margin-bottom:8px">Color scheme for shot quality</div>
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <button class="pill scheme-pill" data-scheme="classic" onclick="setColorScheme('classic')">Classic</button>
        <button class="pill scheme-pill" data-scheme="dusk" onclick="setColorScheme('dusk')">Dusk</button>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <span class="settings-hint">Hole-out prompt distance</span>
        <span class="settings-hint" id="holeout-dist-label" style="color:var(--fairway);font-weight:600">2 ft</span>
      </div>
      <input type="range" id="holeout-dist-slider" class="sg-slider" min="1" max="10" value="2" oninput="setHoleOutDist(this.value)" style="margin-bottom:20px">

      <div class="settings-section-label">My Clubs</div>
      <div class="settings-hint" style="margin-bottom:8px">Select the clubs in your bag</div>
      <div class="pill-group" id="club-toggle-pills" style="margin-bottom:20px"></div>

      <div class="settings-hint" style="margin-bottom:8px">Club selection on shot form</div>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="pill club-expand-pill" data-expand="false" onclick="setClubAutoExpand(false)">Collapsed</button>
        <button class="pill club-expand-pill" data-expand="true" onclick="setClubAutoExpand(true)">Expanded</button>
      </div>

      <div class="settings-hint" style="margin-bottom:8px">Miss direction on shot form</div>
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <button class="pill miss-expand-pill" data-expand="false" onclick="setMissAutoExpand(false)">Collapsed</button>
        <button class="pill miss-expand-pill" data-expand="true" onclick="setMissAutoExpand(true)">Expanded</button>
      </div>

      <div class="settings-section-label">Data</div>

      <button class="btn btn-secondary settings-btn" onclick="backupData()">Backup</button>
      <p class="settings-hint">Downloads a JSON file with all rounds and courses.</p>

      <button class="btn btn-secondary settings-btn" onclick="triggerRestoreFilePicker()">Restore</button>
      <p class="settings-hint">Merge a backup file into your current data.</p>
      <input type="file" id="restore-file-input" accept=".json" style="display:none" onchange="onRestoreFileSelected(event)">

      <!-- Restore preview (hidden until file chosen) -->
      <div id="restore-preview" class="hidden">
        <div class="restore-preview-summary" id="restore-preview-summary"></div>
        <div class="restore-options">
          <label class="restore-option-row">
            <input type="radio" name="restore-mode" value="new" checked> Restore New Rounds Only
          </label>
          <label class="restore-option-row">
            <input type="radio" name="restore-mode" value="all"> Restore All (overwrite duplicates)
          </label>
        </div>
        <button class="btn btn-primary" onclick="confirmRestore()">Confirm Restore</button>
        <button class="btn btn-ghost" style="margin-top:8px" onclick="cancelRestore()">Cancel</button>
      </div>

    </div>
  </div>
</div>
