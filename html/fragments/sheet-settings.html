<!-- SETTINGS SHEET -->
<div class="sheet-overlay" id="settings-sheet" onclick="handleSettingsOverlayClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Settings</div>
    <div class="sheet-body">

      <div class="settings-section-label">Appearance</div>
      <div class="settings-hint" style="margin-bottom:8px">Color scheme for shot quality</div>
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <button class="pill scheme-pill" data-scheme="classic" onclick="setColorScheme('classic')">Classic</button>
        <button class="pill scheme-pill" data-scheme="dusk" onclick="setColorScheme('dusk')">Dusk</button>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <span class="settings-hint">Hole-out prompt distance</span>
        <span class="settings-hint" id="holeout-dist-label" style="color:var(--fairway);font-weight:600">2 ft</span>
      </div>
      <input type="range" id="holeout-dist-slider" class="sg-slider" min="1" max="10" value="2" oninput="setHoleOutDist(this.value)" style="margin-bottom:20px">

      <div class="settings-section-label">My Clubs</div>
      <div class="settings-hint" style="margin-bottom:8px">Select the clubs in your bag</div>
      <div class="pill-group" style="margin-bottom:20px">
        <button class="pill pill-sm club-toggle-pill" data-club="driver" onclick="toggleActiveClub('driver')">Drv</button>
        <button class="pill pill-sm club-toggle-pill" data-club="3w" onclick="toggleActiveClub('3w')">3 W</button>
        <button class="pill pill-sm club-toggle-pill" data-club="5w" onclick="toggleActiveClub('5w')">5-W</button>
        <button class="pill pill-sm club-toggle-pill" data-club="7w" onclick="toggleActiveClub('7w')">7-W</button>
        <button class="pill pill-sm club-toggle-pill" data-club="3h" onclick="toggleActiveClub('3h')">3-H</button>
        <button class="pill pill-sm club-toggle-pill" data-club="4h" onclick="toggleActiveClub('4h')">4-H</button>
        <button class="pill pill-sm club-toggle-pill" data-club="5h" onclick="toggleActiveClub('5h')">5-H</button>
        <button class="pill pill-sm club-toggle-pill" data-club="3i" onclick="toggleActiveClub('3i')">3-I</button>
        <button class="pill pill-sm club-toggle-pill" data-club="4i" onclick="toggleActiveClub('4i')">4-I</button>
        <button class="pill pill-sm club-toggle-pill" data-club="5i" onclick="toggleActiveClub('5i')">5-I</button>
        <button class="pill pill-sm club-toggle-pill" data-club="6i" onclick="toggleActiveClub('6i')">6-I</button>
        <button class="pill pill-sm club-toggle-pill" data-club="7i" onclick="toggleActiveClub('7i')">7-I</button>
        <button class="pill pill-sm club-toggle-pill" data-club="8i" onclick="toggleActiveClub('8i')">8-I</button>
        <button class="pill pill-sm club-toggle-pill" data-club="9i" onclick="toggleActiveClub('9i')">9-I</button>
        <button class="pill pill-sm club-toggle-pill" data-club="pw" onclick="toggleActiveClub('pw')">PW</button>
        <button class="pill pill-sm club-toggle-pill" data-club="gw" onclick="toggleActiveClub('gw')">GW</button>
        <button class="pill pill-sm club-toggle-pill" data-club="sw" onclick="toggleActiveClub('sw')">SW</button>
        <button class="pill pill-sm club-toggle-pill" data-club="lw" onclick="toggleActiveClub('lw')">LW</button>
        <button class="pill pill-sm club-toggle-pill" data-club="50" onclick="toggleActiveClub('50')">50°</button>
        <button class="pill pill-sm club-toggle-pill" data-club="52" onclick="toggleActiveClub('52')">52°</button>
        <button class="pill pill-sm club-toggle-pill" data-club="54" onclick="toggleActiveClub('54')">54°</button>
        <button class="pill pill-sm club-toggle-pill" data-club="56" onclick="toggleActiveClub('56')">56°</button>
        <button class="pill pill-sm club-toggle-pill" data-club="58" onclick="toggleActiveClub('58')">58°</button>
        <button class="pill pill-sm club-toggle-pill" data-club="60" onclick="toggleActiveClub('60')">60°</button>
      </div>

      <div class="settings-section-label">Data</div>

      <button class="btn btn-secondary settings-btn" onclick="backupData()">Backup</button>
      <p class="settings-hint">Downloads a JSON file with all rounds and courses.</p>

      <button class="btn btn-secondary settings-btn" onclick="triggerRestoreFilePicker()">Restore</button>
      <p class="settings-hint">Merge a backup file into your current data.</p>
      <input type="file" id="restore-file-input" accept=".json" style="display:none" onchange="onRestoreFileSelected(event)">

      <!-- Restore preview (hidden until file chosen) -->
      <div id="restore-preview" class="hidden">
        <div class="restore-preview-summary" id="restore-preview-summary"></div>
        <div class="restore-options">
          <label class="restore-option-row">
            <input type="radio" name="restore-mode" value="new" checked> Restore New Rounds Only
          </label>
          <label class="restore-option-row">
            <input type="radio" name="restore-mode" value="all"> Restore All (overwrite duplicates)
          </label>
        </div>
        <button class="btn btn-primary" onclick="confirmRestore()">Confirm Restore</button>
        <button class="btn btn-ghost" style="margin-top:8px" onclick="cancelRestore()">Cancel</button>
      </div>

    </div>
  </div>
</div>
