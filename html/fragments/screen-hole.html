<!-- HOLE ENTRY -->
<div class="screen" id="screen-hole">
  <div class="topbar">
    <button class="btn-topbar" onclick="showScreen('home')">⌂ Home</button>
    <div class="topbar-center">
      <div class="topbar-title topbar-clickable" id="hole-course-name" onclick="openRoundEdit()"></div>
      <div class="topbar-sub topbar-clickable" id="hole-round-date" onclick="openRoundEdit()"></div>
    </div>
    <button class="btn-topbar" onclick="showScreen('summary')">Summary ›</button>
  </div>
  <div class="hole-nav">
    <button class="hole-nav-btn" id="hole-prev-btn" onclick="prevHole()">‹</button>
    <div class="hole-num-block" onclick="toggleHolePicker()">
      <div class="hole-num-label">Hole</div>
      <div class="hole-num" id="hole-num-display">1</div>
      <div class="hole-info">
        <span id="hole-par-display">Par 4</span> ·
        <span class="hole-yardage-edit" onclick="editYardage()">
          <span id="hole-yards-display">400 yds</span>
          <span class="yardage-edit-icon">✎</span>
        </span>
      </div>
      <div class="hole-pills-row">
        <button class="hole-pill-btn hidden" id="green-img-btn" onclick="event.stopPropagation();openGreenImage()">View Green</button>
        <button class="hole-pill-btn hidden" id="yardages-btn" onclick="event.stopPropagation();openYardagesOverlay()">Yardages</button>
      </div>
    </div>
    <button class="hole-nav-btn" id="hole-next-btn" onclick="nextHole()">›</button>
  </div>
  <div id="hole-picker" class="hole-picker hidden"></div>
  <div class="tally-bar">
    <div class="tally-chip active" id="tally-total" onclick="toggleTally('total')"><span class="tally-chip-val" id="tv-total">—</span><span class="tally-chip-lbl">Total</span></div>
    <div class="tally-chip active" id="tally-drive" onclick="toggleTally('drive')"><span class="tally-chip-val" id="tv-drive">—</span><span class="tally-chip-lbl">Drive</span></div>
    <div class="tally-chip active" id="tally-approach" onclick="toggleTally('approach')"><span class="tally-chip-val" id="tv-approach">—</span><span class="tally-chip-lbl">Approach</span></div>
    <div class="tally-chip active" id="tally-shortgame" onclick="toggleTally('shortgame')"><span class="tally-chip-val" id="tv-shortgame">—</span><span class="tally-chip-lbl">Short Game</span></div>
    <div class="tally-chip active" id="tally-putt" onclick="toggleTally('putt')"><span class="tally-chip-val" id="tv-putt">—</span><span class="tally-chip-lbl">Putt</span></div>
  </div>
  <div class="shot-list" id="shot-list"></div>
  <div id="green-img-overlay" class="green-img-overlay hidden" onclick="closeGreenImage()">
    <img id="green-img" src="" alt="Green diagram" class="green-img">
    <div id="green-img-error" class="green-img-error hidden">No image available</div>
  </div>
  <div id="hole-actions">
    <button id="hole-out-prompt" class="add-shot-btn hidden" onclick="holeOut()">⛳ Holed · <span id="hole-out-dist"></span> ft</button>
    <button id="add-shot-btn" class="add-shot-btn" onclick="openShotSheet()"><span class="add-shot-icon">+</span> Add Shot</button>
    <button id="next-hole-btn" class="add-shot-btn hidden" onclick="nextHole()">Next Hole ›</button>
  </div>
  <!-- Yardages overlay -->
  <div class="sheet-overlay" id="yardages-overlay" onclick="handleYardagesOverlayClick(event)">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">My Yardages</div>
      <div class="sheet-body">
        <div class="yrd-filter-area">
          <div class="yrd-range-filter">
            <span class="yrd-filter-label">Range</span>
            <input type="number" id="yrd-low-input" class="yrd-range-input" placeholder="0" min="0" inputmode="numeric" oninput="onYrdRangeInput()">
            <span class="yrd-filter-sep">–</span>
            <input type="number" id="yrd-high-input" class="yrd-range-input" placeholder="∞" min="0" inputmode="numeric" oninput="onYrdRangeInput()">
            <span class="yrd-filter-unit">yds</span>
          </div>
          <div id="yrd-club-filter-pills" class="pill-group hidden" style="margin-top:10px"></div>
        </div>
        <div id="yrd-overlay-list" class="yrd-overlay-list"></div>
      </div>
    </div>
  </div>
</div>
